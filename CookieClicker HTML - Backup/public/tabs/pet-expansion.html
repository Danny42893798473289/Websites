<div id="pet-expansion" class="menu">
  <div class="pet-expansion-panel">
    <h2 style="margin:0 0 8px">Pet Expansion</h2>
    <p class="small" style="margin:0 0 16px">Buy expansion eggs with why eggs. Hatched pets add to your multiplier sum (S) automatically — no equip slot needed.</p>
    <div class="expansion-table-wrap">
      <table class="expansion-table">
        <thead>
          <tr>
            <th>Why Eggs</th>
            <th>Hatching Time</th>
            <th>Effect (S)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expansionTableBody"></tbody>
      </table>
    </div>
    <div id="expansionHatch" class="small" style="margin-top:12px">Expansion hatch: None</div>
    <div id="expansionOwned" class="small" style="margin-top:8px">Owned: None</div>
    <button id="cancelExpansionHatchBtn" class="ghost" onclick="cancelExpansionHatch()" style="margin-top:10px;display:none">Cancel Expansion Hatch</button>
  </div>
</div>
